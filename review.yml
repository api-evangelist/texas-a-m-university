  - date: '2026-09-01'
    rating: 4
    summary: >-
      University-pipeline re-profile with operator attribution settled before anything was saved.
      Six institution-operated surfaces were probed anonymously and answered: the GeoServices
      Geocoding API v5, a previously uncatalogued Aggie Map dining GeoJSON backend at
      api.aggiemap.tamu.edu, a campus micromobility vehicle feed on veoride.geoservices.tamu.edu, a
      public Esri ArcGIS Server operated by Texas A&M IT at gis.it.tamu.edu, the OAKTrust OAI-PMH 2.0
      endpoint, and the university's own Shibboleth IdP SAML metadata registered in InCommon as
      urn:mace:incommon:tamu.edu. Four now carry an OpenAPI in this repository; the ArcGIS and
      CourseLeaf contracts deliberately do not, because those are Esri's and Leepfrog's product
      specifications rather than Texas A&M's engineering. Registry memberships were evidenced from
      each registry's own API: DataCite provider CXAU carrying Texas A&M's ROR id, DataCite
      repository client TDL.TAMU, Crossref member 14385, and DOI prefix 10.21423 registered at both.
      Three corrections to the June 2026 profile: the v4 SOAP WSDL advertised in Texas A&M's own
      documentation 302-redirects to a server-error page; data.tamu.edu resolves but does not
      connect, so no open-data portal is claimed; and the System developer portal returns no catalog
      to an unauthenticated caller, so the enterprise tier is inventoried, never described as
      callable. GeoServices signals every failure with HTTP 200 and an in-body status code, which is
      recorded in errors/ because transport-level monitoring cannot see it.
