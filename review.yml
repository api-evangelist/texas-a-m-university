      Verified live: the Texas A&M University System API Developer Portal
      (api-doc.sea.system.tamus.edu, 200) and the publicly documented TAMU
      GeoServices Geocoding API (geoservices.tamu.edu, 200) with a public
      signup and a stable v5 REST base URL. The UIN Services API is documented
      but gated behind SEA DevOps subscription approval, so no public base URL
      was published. The TAMULib GitHub org hosts substantial library
      open-source (IIIF, DSpace, Vireo) but these are deployable software, not
      hosted public APIs. No fabricated endpoints; gated and code-only items
      are marked as such. LinkedIn returns 999 to bots, which is expected and
      not a failure.
