x-coverage:
  state: covered
  reason: covered
  detail: >-
    Texas A&M is not a thin profile. Six institution-operated surfaces were probed anonymously and
    answered — the GeoServices Geocoding API, the Aggie Map dining GeoJSON feed, the campus
    micromobility vehicle feed, the Texas A&M IT ArcGIS REST services directory, the OAKTrust
    OAI-PMH endpoint and the Shibboleth IdP SAML metadata — and four of them are described by a
    contract in openapi/ with its operator settled. Four limits on that coverage are recorded rather
    than papered over. First, the Texas A&M University System enterprise tier
    (api-doc.sea.system.tamus.edu, the UIN Services API) is live but returns no catalog and no
    specification to an unauthenticated caller, and every portal discovery route tried returned 404;
    it is inventoried from Texas A&M's own documentation and never described as callable. Second, a
    Cloudflare managed challenge returns HTTP 403 with a "Just a moment…" interstitial to automated
    requests on oaktrust.library.tamu.edu/server/api, scholars.library.tamu.edu and hprc.tamu.edu
    even with a browser User-Agent, so the DSpace REST API, Scholars@TAMU and the High Performance
    Research Computing site are recorded as live-but-blocked — a fact about our access, not about
    Texas A&M. Third, data.tamu.edu resolves in DNS (CNAME weasel.tamu.edu) but timed out on every
    HTTPS attempt, so no open-data portal is claimed. Fourth, GeoServices returns HTTP 200 for
    failed calls and carries the real 401/402 inside the JSON body, so a successful geocode response
    could not be observed without an account key and its success schema is marked derived, not
    probed.
