aid: texas-a-m-university
name: Texas A&M University
x-type: university
x-category: Public Research University
description: >-
  Texas A&M University is a public land-grant research university in College Station, Texas, the
  flagship of the Texas A&M University System, and ranked #154 in the QS World University Rankings
  2025. Unlike most institutions in this cohort it is not a pure buyer: several of the surfaces
  recorded here are Texas A&M's own engineering on Texas A&M's own hosts, and each one below was
  fetched and given a status code before it was written down.

  The genuinely institution-operated tier is four contracts wide. Texas A&M GeoServices
  (geoservices.tamu.edu) publishes a documented, free, self-service geocoding and address
  normalisation API at version 5.0.0 that returns up to 172 output fields — a research product of the
  university's geospatial group and the strongest institution-authored API in the higher-education
  catalog. The Aggie Map application backend (api.aggiemap.tamu.edu) serves campus dining locations
  with live open/closed state as GeoJSON, and a companion feed on geoservices.tamu.edu serves live
  shared-micromobility vehicle positions; both are undocumented, unauthenticated backends rather than
  offered products, and are recorded as such. Texas A&M IT runs a public Esri ArcGIS Server
  (gis.it.tamu.edu, mirrored at gis.tamu.edu) whose services directory answers anonymously across
  seven folders of campus base maps, construction, transit and event-flow layers.

  Two further institution-operated surfaces are protocol surfaces rather than REST APIs. The
  university's Shibboleth Identity Provider publishes SAML 2.0 metadata unauthenticated from
  idp.tamu.edu and is registered in InCommon as urn:mace:incommon:tamu.edu, which carries it into
  eduGAIN — the surface class this cohort was most completely missing. The OAKTrust institutional
  repository exposes a working OAI-PMH 2.0 endpoint whose Identify response names Texas A&M
  Libraries' own help desk and no vendor at all, which is rare in this cohort.

  Against that, the enterprise tier is closed. The Texas A&M University System API Developer Portal
  (api-doc.sea.system.tamus.edu) is live but renders nothing without a sponsored System account; the
  UIN Services API is documented in prose and gated behind subscription approval by the System
  Enterprise Applications DevOps group, so no base URL and no specification is published. There is no
  open-data portal — data.tamu.edu resolves in DNS but every HTTPS connection times out — no llms.txt,
  and no student-facing course or registrar API. The course catalog is a Leepfrog CourseLeaf tenancy
  and the LMS is an Instructure Canvas tenancy; both are real relationships and neither is Texas A&M's
  contract. Texas A&M Libraries holds DOI prefix 10.21423 as a registrant at both DataCite and
  Crossref, and the university carries ROR id 01f5ytq51.
