apis:
  - aid: texas-a-m-university:geoservices-geocode
    name: Texas A&M GeoServices Geocoding API
    x-operator: institution
    description: >-
      Free geocoding, address normalisation and standardisation, census intersection and reverse
      geocoding from Texas A&M GeoServices. Version 5.0.0 returns up to 172 output fields; an API key
      from a free self-service account profile is required on every request and travels as a query
      parameter. Institution-operated: geoservices.tamu.edu is under Texas A&M's own registrable
      domain and the service is the university's own research product, not a platform vendor's.
      Verified live 2026-09-01 — an anonymous call returns HTTP 200 carrying queryStatusCode
      APIKeyMissing, which confirms both the parameter contract and the auth model.
    humanURL: https://geoservices.tamu.edu/Services/Geocode/WebService/Details/
    baseURL: https://geoservices.tamu.edu/Api/Geocode/V5/
    tags: [ Geocoding, Geospatial, Address, GIS ]
