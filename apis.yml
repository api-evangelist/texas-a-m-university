  - aid: texas-a-m-university:campus-micromobility
    name: Campus Micromobility Vehicle Positions API
    x-operator: institution
    description: >-
      Live positions of shared micromobility vehicles on and around campus as GeoJSON, served from
      veoride.geoservices.tamu.edu inside Texas A&M's own geoservices estate. Verified 200 on
